<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Command Ultimate</title>
    <!-- Twitch Embed API -->
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>

    <style>
        :root {
            --bg: #050505;
            --panel: #141414;
            --border: #333;
            --primary: #9146FF;
            --danger: #ff4444;
            --text: #ffffff;
            --header-height: 60px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; /* Body scrollt nicht, nur der Stage Bereich */
        }

        /* HEADER */
        header {
            flex-shrink: 0;
            height: var(--header-height);
            background: rgba(10,10,10,0.95);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }
        .brand { font-weight: 800; font-size: 1.1rem; letter-spacing: -0.5px; }
        .brand span { color: var(--primary); }
        .menu-btn { font-size: 1.5rem; background: none; border: none; color: white; cursor: pointer; padding: 5px; }

        /* NAVIGATION MENU */
        #nav {
            position: fixed; top: var(--header-height); right: 0; bottom: 0;
            width: 260px; background: #0e0e0e; border-left: 1px solid var(--border);
            transform: translateX(100%); transition: transform 0.3s ease;
            z-index: 99; padding: 20px; display: flex; flex-direction: column; gap: 10px;
        }
        #nav.open { transform: translateX(0); box-shadow: -5px 0 20px rgba(0,0,0,0.5); }
        
        .nav-item {
            padding: 15px; background: #1a1a1a; border-radius: 8px; cursor: pointer;
            text-align: center; font-weight: 600; border: 1px solid transparent; transition: 0.2s;
        }
        .nav-item:hover { border-color: var(--primary); color: var(--primary); }
        .nav-item.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* MAIN STAGE (SCROLLABLE AREA) */
        #stage {
            flex: 1;
            overflow-y: auto; /* HIER IST DER SCROLL FIX */
            overflow-x: hidden;
            padding: 5px;
            display: grid;
            gap: 5px;
            /* Standard Grid Verhalten */
            grid-template-columns: 1fr;
            grid-auto-rows: min-content; /* Passt sich dem Inhalt an */
        }

        /* --- LAYOUT MODI --- */

        /* 1. GRID MODE (Responsiv) */
        .mode-grid {
            /* Mobile: 1 Spalte, Höhe automatisch anhand Aspect Ratio */
            grid-template-columns: 1fr; 
        }
        @media (min-width: 768px) {
            .mode-grid {
                /* Tablet: 2 Spalten */
                grid-template-columns: repeat(2, 1fr);
                /* Desktop Slots sollen nicht zu riesig werden, aber füllen */
                grid-auto-rows: 1fr; 
            }
        }
        @media (min-width: 1200px) {
            .mode-grid {
                /* Desktop: 3 Spalten */
                grid-template-columns: repeat(3, 1fr);
                /* Fixiere auf 2 Zeilen wenn möglich, sonst scrollen */
                grid-template-rows: repeat(2, 50vh); 
                grid-auto-rows: 50vh; 
            }
            /* Scroll Fix Desktop: Wenn Fenster zu klein, dann scrollen statt abschneiden */
            #stage.mode-grid { height: calc(100vh - var(--header-height)); }
        }

        /* 2. SPLIT MODE */
        .mode-split .slot { display: none; } /* Verstecke ungenutzte */
        .mode-split {
            grid-template-columns: 1fr;
            grid-template-rows: 50vh 30vh 30vh; /* Mobile Höhen festlegen */
            grid-template-areas: 
                "main"
                "side1"
                "side2";
        }
        @media (min-width: 1024px) {
            .mode-split {
                grid-template-columns: 3fr 1fr; 
                grid-template-rows: 1fr 1fr;
                height: 100%; /* Fülle Screen */
                grid-template-areas: 
                    "main side1"
                    "main side2";
            }
        }
        /* Zuweisung */
        .mode-split .slot.pos-main { display: flex; grid-area: main; border: 2px solid var(--primary); }
        .mode-split .slot.pos-side1 { display: flex; grid-area: side1; }
        .mode-split .slot.pos-side2 { display: flex; grid-area: side2; }

        /* 3. FULLSCREEN MODE */
        .mode-full .slot { display: none; }
        .mode-full .slot.is-focus { 
            display: flex; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; 
            background: #000;
        }

        /* --- SLOT STYLING --- */
        .slot {
            background: var(--panel);
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 250px; /* Mindesthöhe für Mobile, damit man was sieht */
        }
        /* Im Grid Mode Desktop kann die Höhe variieren */
        @media(min-width: 768px) { .slot { min-height: 0; } }

        /* Empty State */
        .empty-state {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #555; cursor: pointer; transition: 0.2s; min-height: 200px;
        }
        .empty-state:hover { background: #1f1f1f; color: var(--primary); }
        .plus-icon { font-size: 3rem; margin-bottom: 10px; }

        /* Overlay UI (Hover) */
        .slot-ui {
            position: absolute; top: 0; left: 0; right: 0; height: 40px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: space-between; padding: 0 8px;
            opacity: 0; transition: opacity 0.2s; z-index: 20;
        }
        /* Zeige UI bei Hover oder wenn Chat offen ist oder Touch */
        .slot:hover .slot-ui, .slot.chat-active .slot-ui { opacity: 1; }

        .tag-name { font-size: 0.75rem; font-weight: bold; background: var(--primary); padding: 2px 6px; border-radius: 3px; }

        .btn-group { display: flex; gap: 5px; }
        .c-btn {
            width: 28px; height: 28px; border: 1px solid rgba(255,255,255,0.2); background: transparent;
            color: #ddd; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .c-btn:hover { background: var(--primary); border-color: var(--primary); color: white; }
        .c-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
        .c-btn.delete:hover { background: var(--danger); border-color: var(--danger); }

        /* Dropdown im Split Mode */
        .pos-select {
            display: none; background: #000; color: white; border: 1px solid #444; font-size: 0.7rem; padding: 2px;
        }
        .mode-split .pos-select { display: block; margin-left: 10px; }

        /* Media Container (Video + Chat) */
        .media-wrap { flex: 1; display: flex; position: relative; width: 100%; height: 100%; }
        .video-container { flex: 1; background: #000; width: 100%; height: 100%; }
        
        .chat-container {
            width: 0; background: #0e0e0e; border-left: 1px solid #333; transition: width 0.3s ease;
            position: relative; overflow: hidden;
        }
        /* Chat Logic */
        .slot.chat-active .chat-container { width: 340px; }
        
        /* Mobile Chat: Unten andocken statt daneben */
        @media (max-width: 650px) {
            .slot.chat-active .media-wrap { flex-direction: column; }
            .slot.chat-active .chat-container { 
                width: 100% !important; 
                height: 400px; /* Feste Höhe für Chat mobil */
                border-left: none; border-top: 1px solid #333; 
            }
        }

        /* MODAL */
        dialog {
            background: #18181b; color: white; border: 1px solid #333; border-radius: 8px;
            padding: 20px; width: 90%; max-width: 400px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        dialog::backdrop { background: rgba(0,0,0,0.8); }
        input { width: 100%; padding: 12px; margin: 15px 0; background: #000; border: 1px solid #333; color: white; border-radius: 4px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
        .btn-modal { padding: 10px 20px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; }
        .btn-save { background: var(--primary); color: white; }
        .btn-cancel { background: transparent; color: #888; border: 1px solid #444; }

    </style>
</head>
<body>

    <header>
        <div class="brand">STREAM <span>COMMAND</span></div>
        <button class="menu-btn" onclick="toggleNav()">☰</button>
    </header>

    <div id="nav">
        <div class="nav-item active" onclick="setMode('mode-grid')">GRID ÜBERSICHT</div>
        <div class="nav-item" onclick="setMode('mode-split')">SPLIT (1 + 2)</div>
        <div class="nav-item" onclick="setMode('mode-full')">VOLLBILD</div>
        <div style="margin-top:auto; font-size:0.75rem; color:#666; text-align:center;">
            Status: <span id="status">Bereit</span>
        </div>
    </div>

    <!-- HIER FINDET DIE ACTION STATT -->
    <div id="stage" class="mode-grid">
        <!-- Slots werden via JS generiert -->
    </div>

    <dialog id="modal">
        <h3>Neuen Stream laden</h3>
        <p style="color:#aaa; font-size:0.9rem;">Twitch Link oder Name eingeben:</p>
        <input type="text" id="streamInput" placeholder="z.B. papaplatte">
        <div class="modal-btns">
            <button class="btn-modal btn-cancel" onclick="closeModal()">Abbruch</button>
            <button class="btn-modal btn-save" onclick="saveStream()">Laden</button>
        </div>
    </dialog>

    <script>
        // --- SETUP ---
        // Liste von Domains, die den Stream einbetten dürfen (Sicherheitsregel von Twitch)
        const HOST = window.location.hostname || "localhost";
        const PARENTS = [HOST, "localhost", "127.0.0.1", "twitch.tv"];

        const state = {
            mode: 'mode-grid',
            channels: Array(6).fill(null), // Die Namen der Streamer
            players: Array(6).fill(null), // Die Twitch Player Objekte
            posMap: { main: 0, side1: 1, side2: 2 }, // Wer ist wo im Split Mode
            focusIndex: 0, // Wer ist im Vollbild
            editingIndex: -1 // Welcher Slot wird gerade bearbeitet
        };

        const stage = document.getElementById('stage');
        const modal = document.getElementById('modal');
        const input = document.getElementById('streamInput');
        const nav = document.getElementById('nav');

        // --- START ---
        function init() {
            // Check ob API geladen wurde
            if(typeof Twitch === 'undefined') {
                document.getElementById('status').innerText = "⚠️ API Fehler (Adblock?)";
                document.getElementById('status').style.color = "red";
            }

            // 1. Grundgerüst bauen
            createSlots();
            
            // 2. Gespeicherte Daten laden (Persistence)
            loadFromStorage();
        }

        // Baut die 6 Slot-Container (Inhalt kommt später)
        function createSlots() {
            stage.innerHTML = '';
            for(let i=0; i<6; i++) {
                const div = document.createElement('div');
                div.className = 'slot';
                div.id = `slot-${i}`;
                div.innerHTML = getEmptyHTML(i);
                stage.appendChild(div);
            }
            updateLayoutClasses();
        }

        // --- SLOT MANAGEMENT (Der wichtigste Teil) ---
        
        function updateSlot(index) {
            const slot = document.getElementById(`slot-${index}`);
            const channel = state.channels[index];

            // A) SLOT LÖSCHEN / LEEREN
            if(!channel) {
                // Alten Player sauber entfernen um Speicherlecks zu verhindern
                if(state.players[index]) {
                    try { state.players[index].setMuted(true); } catch(e){}
                    state.players[index] = null;
                }
                slot.innerHTML = getEmptyHTML(index);
                slot.classList.remove('chat-active');
                return;
            }

            // B) SLOT BEFÜLLEN
            // Wir bauen das HTML für den belegten Slot
            // Wichtig: Wir nutzen Dropdowns für die Position im Split Mode
            const isMain = state.posMap.main === index;
            const isSide1 = state.posMap.side1 === index;
            const isSide2 = state.posMap.side2 === index;

            slot.innerHTML = `
                <div class="slot-ui">
                    <div style="display:flex; align-items:center;">
                        <span class="tag-name">${channel}</span>
                        <!-- Split Mode Selektor -->
                        <select class="pos-select" onchange="changePos(${index}, this.value)">
                            <option value="main" ${isMain?'selected':''}>Haupt</option>
                            <option value="side1" ${isSide1?'selected':''}>Seite 1</option>
                            <option value="side2" ${isSide2?'selected':''}>Seite 2</option>
                            <option value="none" disabled>---</option>
                        </select>
                    </div>
                    <div class="btn-group">
                        <button class="c-btn" onclick="toggleAudio(${index}, this)" title="Audio">🔊</button>
                        <button class="c-btn" onclick="toggleChat(${index}, this)" title="Chat">💬</button>
                        <button class="c-btn" onclick="goFullscreen(${index})" title="Vollbild">⛶</button>
                        <button class="c-btn delete" onclick="deleteStream(${index})" title="Löschen">✕</button>
                    </div>
                </div>
                <div class="media-wrap">
                    <div class="video-container" id="embed-vid-${index}"></div>
                    <div class="chat-container" id="embed-chat-${index}"></div>
                </div>
            `;

            // Player initialisieren (mit kleinem Timeout für DOM Sicherheit)
            setTimeout(() => initTwitchPlayer(index, channel), 50);
        }

        function initTwitchPlayer(i, channel) {
            try {
                // Video Embedding
                const options = {
                    width: '100%',
                    height: '100%',
                    channel: channel,
                    parent: PARENTS,
                    layout: 'video',
                    autoplay: true,
                    muted: true // Startet stumm
                };
                const player = new Twitch.Player(`embed-vid-${i}`, options);
                player.setVolume(0.5);
                state.players[i] = player;

                // Chat Embedding (Iframe manuell)
                const chatDiv = document.getElementById(`embed-chat-${i}`);
                if(chatDiv) {
                    const frame = document.createElement('iframe');
                    frame.src = `https://www.twitch.tv/embed/${channel}/chat?parent=${HOST}&parent=localhost&darkpopout`;
                    frame.style.width = "100%";
                    frame.style.height = "100%";
                    frame.style.border = "none";
                    chatDiv.appendChild(frame);
                }
            } catch(e) {
                console.error("Twitch Init Error:", e);
                // Fehlermeldung im Slot anzeigen
                document.getElementById(`embed-vid-${i}`).innerHTML = `<div style="color:red; padding:20px;">Ladefehler. Bitte Seite neu laden oder HTTPS nutzen.</div>`;
            }
        }

        function getEmptyHTML(i) {
            return `
                <div class="empty-state" onclick="openModal(${i})">
                    <div class="plus-icon">+</div>
                    <div>Slot ${i+1} belegen</div>
                </div>
            `;
        }

        // --- INTERAKTIONEN ---

        function openModal(i) {
            state.editingIndex = i;
            input.value = '';
            modal.showModal();
            // Fokus aufs Eingabefeld (verbessert UX)
            setTimeout(() => input.focus(), 100); 
        }

        function closeModal() { modal.close(); }

        function saveStream() {
            let val = input.value.trim();
            if(!val) return;

            // PARSER: Macht den Link "kaputt" und holt nur den Namen
            // 1. Protokoll weg (https://)
            val = val.replace(/.*\/\//, '');
            // 2. Domain weg (twitch.tv/)
            if(val.includes('twitch.tv/')) val = val.split('twitch.tv/')[1];
            // 3. Alles nach dem Namen weg (/clip, ?referral, etc.)
            val = val.split('/')[0].split('?')[0];

            if(val.length > 0) {
                state.channels[state.editingIndex] = val;
                updateSlot(state.editingIndex);
                saveToStorage();
                closeModal();
            }
        }

        function deleteStream(i) {
            state.channels[i] = null;
            updateSlot(i);
            saveToStorage();
        }

        function toggleAudio(index, btn) {
            // Logik: Alle anderen Muten, den gewählten Unmuten
            state.players.forEach((p, i) => {
                if(p) {
                    if(i === index) {
                        const isMuted = p.getMuted();
                        p.setMuted(!isMuted);
                        btn.classList.toggle('active', isMuted);
                    } else {
                        p.setMuted(true);
                        // Reset anderer Button
                        const otherBtn = document.querySelector(`#slot-${i} .c-btn[title="Audio"]`);
                        if(otherBtn) otherBtn.classList.remove('active');
                    }
                }
            });
        }

        function toggleChat(index, btn) {
            const slot = document.getElementById(`slot-${index}`);
            slot.classList.toggle('chat-active');
            btn.classList.toggle('active');
        }

        function goFullscreen(index) {
            state.focusIndex = index;
            setMode('mode-full');
        }

        // --- LAYOUT & LOGIK ---

        function setMode(modeName) {
            state.mode = modeName;
            stage.className = modeName;
            
            // Nav Active State
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(modeName === 'mode-grid') document.querySelectorAll('.nav-item')[0].classList.add('active');
            if(modeName === 'mode-split') document.querySelectorAll('.nav-item')[1].classList.add('active');
            if(modeName === 'mode-full') document.querySelectorAll('.nav-item')[2].classList.add('active');

            updateLayoutClasses();
            toggleNav();
        }

        function changePos(slotIdx, newRole) {
            // Tausche die Rollen
            const oldOwner = state.posMap[newRole];
            
            // Finde aktuelle Rolle von slotIdx
            let currentRole = null;
            if(state.posMap.main == slotIdx) currentRole = 'main';
            if(state.posMap.side1 == slotIdx) currentRole = 'side1';
            if(state.posMap.side2 == slotIdx) currentRole = 'side2';

            state.posMap[newRole] = slotIdx;
            if(currentRole) state.posMap[currentRole] = oldOwner;

            updateLayoutClasses();
            
            // UI Update für Dropdowns (ohne Reload)
            state.channels.forEach((_, i) => {
                const sel = document.querySelector(`#slot-${i} .pos-select`);
                if(sel) {
                    if(state.posMap.main == i) sel.value = 'main';
                    else if(state.posMap.side1 == i) sel.value = 'side1';
                    else if(state.posMap.side2 == i) sel.value = 'side2';
                    else sel.value = 'none';
                }
            });
        }

        function updateLayoutClasses() {
            for(let i=0; i<6; i++) {
                const el = document.getElementById(`slot-${i}`);
                el.classList.remove('pos-main', 'pos-side1', 'pos-side2', 'is-focus');

                // Split Logic
                if(state.mode === 'mode-split') {
                    if(state.posMap.main == i) el.classList.add('pos-main');
                    if(state.posMap.side1 == i) el.classList.add('pos-side1');
                    if(state.posMap.side2 == i) el.classList.add('pos-side2');
                }
                // Fullscreen Logic
                if(state.mode === 'mode-full' && state.focusIndex == i) {
                    el.classList.add('is-focus');
                }
            }
        }

        function toggleNav() {
            nav.classList.toggle('open');
        }

        // --- LOCAL STORAGE (Persistence) ---
        function saveToStorage() {
            localStorage.setItem('sc-slots', JSON.stringify(state.channels));
        }

        function loadFromStorage() {
            const data = localStorage.getItem('sc-slots');
            if(data) {
                try {
                    const names = JSON.parse(data);
                    names.forEach((name, i) => {
                        if(name) {
                            state.channels[i] = name;
                            updateSlot(i);
                        }
                    });
                } catch(e) { console.log("Storage Error", e); }
            }
        }

        // Los geht's
        init();

    </script>
</body>
</html>
