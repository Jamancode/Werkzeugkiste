<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Command 28 (Responsive Gold)</title>
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>

    <style>
        :root {
            --bg: #000; --panel: #0a0a0a; --primary: #9146FF;
            --active: #00ffcc; --danger: #ff4444; --text: #fff;
            --safe-z: 10000;
        }

        /* GLOBAL RESET */
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column; 
        }

        /* HEADER */
        header {
            flex-shrink: 0; height: 35px; background: rgba(5,5,5,0.95); border-bottom: 1px solid #222;
            display: flex; align-items: center; padding: 0 10px; z-index: 500; transition: transform 0.3s;
        }
        header.hide { transform: translateY(-100%); }
        .brand { font-weight: 900; font-size: 0.85rem; color: var(--primary); letter-spacing: 0.5px; text-transform: uppercase; }

        /* MENU BTN */
        .float-btn {
            position: fixed; top: 3px; right: 5px; width: 28px; height: 28px;
            background: #111; border: 1px solid #333; border-radius: 4px;
            color: white; font-size: 1.1rem; cursor: pointer; z-index: var(--safe-z);
            display: flex; align-items: center; justify-content: center;
        }

        /* NAV */
        #nav {
            position: fixed; top: 0; right: 0; bottom: 0; width: 280px;
            background: #080808; border-left: 1px solid #222;
            transform: translateX(100%); transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9000; padding-top: 45px; display: flex; flex-direction: column;
            box-shadow: -10px 0 50px rgba(0,0,0,0.9);
        }
        #nav.open { transform: translateX(0); }
        
        .menu-tabs { display: flex; border-bottom: 1px solid #222; background: #0c0c0c; flex-shrink: 0; }
        .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: #666; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .tab-btn.active { background: #151515; color: var(--primary); border-bottom: 2px solid var(--primary); color: #fff; }

        .menu-content { flex: 1; overflow-y: auto; padding: 10px; display: none; }
        .menu-content.active { display: block; }

        .nav-item {
            padding: 12px; background: #151515; border-radius: 6px; text-align: center; font-weight: bold; 
            border: 1px solid transparent; margin-bottom: 8px; cursor: pointer; font-size: 0.85rem;
        }
        .nav-item.active { background: var(--primary); color: white; }
        .nav-item.exit { background: #300; border-color: var(--danger); display: none; }
        body.is-fullscreen .nav-item.exit { display: block; }

        /* SETTINGS */
        .set-row { background: #111; padding: 8px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #222; }
        .set-header { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.7rem; font-weight: bold; color: #888; }
        .set-input { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 6px; border-radius: 4px; margin-bottom: 4px; font-size: 0.9rem; }
        .set-select { width: 100%; background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 4px; border-radius: 4px; margin-bottom: 4px; font-size: 0.85rem; }
        .set-actions { display: flex; gap: 5px; }
        .set-btn { flex: 1; padding: 6px; background: #1a1a1a; color: #ccc; border: 1px solid #333; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
        .set-btn.act { background: var(--primary); color: #fff; border-color: var(--primary); }
        .set-btn.danger { background: #300; border-color: #500; }
        
        .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #151515; border-radius: 6px; margin-bottom: 10px; border: 1px solid #333;}
        .toggle-lbl { font-weight: bold; font-size: 0.85rem; }

        /* STAGE & GRID SYSTEM */
        #stage {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            display: grid; padding: 0; gap: 2px;
            background: #000;
        }
        
        /* === RESPONSIVE SPLIT MODE (Der Kern der Lösung) === */
        
        /* 1. Mobile Portrait (Standard) */
        .mode-split {
            display: grid;
            height: 100%;
            /* Oben Main (60%), Unten geteilt (40%) */
            grid-template-rows: 60fr 40fr; 
            grid-template-columns: 1fr 1fr; 
            grid-template-areas: 
                "main main" 
                "side1 side2";
            transition: grid-template-rows 0.3s ease;
        }
        
        /* Wenn "Lang Chat" aktiv ist (wird per JS Klasse gesetzt) */
        body.long-chat .mode-split {
            /* Oben Main (75%), Unten (25%) */
            grid-template-rows: 75fr 25fr;
        }

        /* 2. Desktop Landscape */
        @media (min-width: 1024px) {
            .mode-split {
                grid-template-columns: 3fr 1fr; 
                grid-template-rows: 1fr 1fr;
                grid-template-areas: "main side1" "main side2";
            }
        }

        /* Zuweisung */
        .mode-split .slot { display: none; } /* Verstecke nicht zugewiesene */
        .mode-split .slot.p-main { display: flex; grid-area: main; border-bottom: 1px solid #333; }
        .mode-split .slot.p-side1 { display: flex; grid-area: side1; border-right: 1px solid #333; }
        .mode-split .slot.p-side2 { display: flex; grid-area: side2; }

        /* Grid Mode Fallback */
        .mode-grid { grid-template-columns: 1fr; grid-auto-rows: min-content; padding: 2px !important; gap: 4px; }
        @media (min-width: 700px) { .mode-grid { grid-template-columns: 1fr 1fr; } }

        /* Fullscreen */
        .mode-full .slot { display: none; }
        .mode-full .slot.is-focus { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: #000; }

        /* SLOT DESIGN */
        .slot {
            background: var(--panel); position: relative; display: flex; flex-direction: column;
            overflow: hidden;
        }
        .mode-grid .slot { min-height: 240px; border-radius: 4px; }
        
        /* UI BAR */
        .ui-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 28px;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(2px);
            display: flex; align-items: center; justify-content: space-between; padding: 0 4px;
            opacity: 0; transition: opacity 0.2s; z-index: 20; pointer-events: none;
        }
        .slot:hover .ui-bar, .slot.active-touch .ui-bar, .slot.chat-on .ui-bar { opacity: 1; pointer-events: auto; }
        .lbl { font-size: 0.6rem; font-weight: bold; background: var(--primary); padding: 1px 4px; border-radius: 3px; max-width: 60px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .tools { display: flex; gap: 2px; }
        .btn { width: 22px; height: 22px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: #ccc; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.75rem;}
        .btn.act { background: var(--active); color: #000; border-color: var(--active); }
        .pos-sel { display: none; background: #222; color: #fff; border: 1px solid #555; padding: 0 2px; font-size: 0.6rem; margin-left: 5px; cursor: pointer; pointer-events: auto; }
        .mode-split .pos-sel { display: block; }

        /* --- CONTENT & VIDEO SCALING --- */
        .content { 
            flex: 1; display: flex; width: 100%; height: 100%; position: relative; 
            flex-direction: column; /* Standard: Untereinander für Mobile Perfektion */
            background: #000;
        }

        /* Desktop Override: Side-by-Side */
        @media (min-width: 1024px) { .content { flex-direction: row; } }

        .vid { 
            width: 100%; 
            /* DER FIX: 16:9 Ratio erzwingen, damit keine schwarzen Balken entstehen */
            aspect-ratio: 16/9; 
            background: #000; flex: none; /* Nicht dehnen */
        }
        
        /* Chat füllt den Rest */
        .chat-wrap { 
            width: 100%; 
            flex: 1; /* Nimmt den GANZEN Restplatz ein */
            background: #0e0e0e; 
            border-top: 1px solid #333; position: relative; overflow: hidden; 
            display: none; /* Standard aus */
        }
        
        .slot.chat-on .chat-wrap { display: block; }
        
        /* Die kleinen Slots unten brauchen kein Aspect-Ratio Hack, die sollen füllen */
        .p-side1 .vid, .p-side2 .vid { aspect-ratio: auto; height: 100%; flex: 1; }
        /* Chat bei den kleinen unten optional ausblenden oder overlay? */
        /* Wir lassen ihn da, aber er wird klein sein */

        /* CHAT ZOOM (Lesbarkeit) */
        .chat-frame {
            width: 100%; height: 100%; border: none; display: block;
        }

        .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #333; cursor: pointer; }
        .empty span { font-size: 2.5rem; }

        /* MODAL */
        dialog { background: #18181b; color: #fff; border: 1px solid #333; width: 90%; max-width: 350px; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 20px; border-radius: 8px; z-index: 12000; }
        dialog::backdrop { background: rgba(0,0,0,0.8); }
        input { width: 100%; padding: 10px; margin: 15px 0; background: #000; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .row-btn { display: flex; justify-content: flex-end; gap: 10px; }
        .b-ok { background: var(--primary); border: none; padding: 10px 20px; color: #fff; border-radius: 4px; cursor: pointer; }
        .b-no { background: transparent; border: 1px solid #444; padding: 10px 20px; color: #aaa; border-radius: 4px; cursor: pointer; }

    </style>
</head>
<body id="body">

    <header id="header">
        <div class="brand">STREAM COMMAND 28</div>
    </header>

    <div class="float-btn" onclick="toggleNav()">☰</div>

    <div id="nav">
        <div class="menu-tabs">
            <button class="tab-btn active" onclick="switchTab('view')">ANSICHT</button>
            <button class="tab-btn" onclick="switchTab('settings')">SETTINGS</button>
        </div>
        <div id="tab-view" class="menu-content active">
            <div class="nav-item exit" onclick="exitFullscreen()">⚠️ VOLLBILD ENDE</div>
            <div class="nav-item active" onclick="setMode('mode-grid')">GRID ÜBERSICHT</div>
            <div class="nav-item" onclick="setMode('mode-split')">SPLIT VIEW (PERFECT)</div>
            <div class="nav-item" onclick="setMode('mode-full')">VOLLBILD</div>
            <div style="margin-top:20px; text-align:center; font-size:0.7rem; color:#555;">
                No Black Bars • 100% Width<br>
                Video Top / Chat Bottom
            </div>
        </div>
        <div id="tab-settings" class="menu-content">
            <div class="toggle-row">
                <span class="toggle-lbl">Lang Chat (Split View)</span>
                <button id="btn-longchat" class="set-btn" style="flex:0 0 60px" onclick="toggleLongChat()">AUS</button>
            </div>
            <div id="settings-list"></div>
        </div>
    </div>

    <div id="stage" class="mode-grid"></div>

    <dialog id="modal">
        <h3 id="modalTitle">Stream hinzufügen</h3>
        <input type="text" id="inp" placeholder="Kanalname..." autocomplete="off">
        <div class="row-btn">
            <button class="b-no" onclick="modal.close()">Abbruch</button>
            <button class="b-ok" onclick="save()">Speichern</button>
        </div>
    </dialog>

    <script>
        // Hosting Fix
        const HOST = window.location.hostname || "localhost";
        const PARENTS = [HOST, "localhost", "127.0.0.1", "twitch.tv", "raw.githack.com"];

        const state = {
            mode: 'mode-grid',
            longChat: false,
            slots: Array(6).fill(null),
            players: Array(6).fill(null),
            qualities: Array(6).fill('auto'),
            pos: { main: 0, s1: 1, s2: 2 },
            focus: 0,
            editIndex: -1
        };

        const stage = document.getElementById('stage');
        const modal = document.getElementById('modal');
        const inp = document.getElementById('inp');
        const nav = document.getElementById('nav');
        const header = document.getElementById('header');
        const settingsList = document.getElementById('settings-list');
        const btnLongChat = document.getElementById('btn-longchat');

        function init() {
            stage.innerHTML = '';
            for(let i=0; i<6; i++) {
                const el = document.createElement('div');
                el.className = 'slot';
                el.id = 's-'+i;
                el.onclick = () => { el.classList.add('active-touch'); setTimeout(()=>el.classList.remove('active-touch'), 4000); };
                stage.appendChild(el);
            }
            loadStorage();
            
            // Apply Long Chat state
            if(state.longChat) {
                document.body.classList.add('long-chat');
                btnLongChat.innerText = "AN";
                btnLongChat.classList.add('act');
            }

            for(let i=0; i<6; i++) {
                if(!state.slots[i]) updateSlotHTML(i, null);
            }
            setupScroll();
            renderSettingsPanel();
        }

        function toggleLongChat() {
            state.longChat = !state.longChat;
            if(state.longChat) {
                document.body.classList.add('long-chat');
                btnLongChat.innerText = "AN";
                btnLongChat.classList.add('act');
            } else {
                document.body.classList.remove('long-chat');
                btnLongChat.innerText = "AUS";
                btnLongChat.classList.remove('act');
            }
            persist();
        }

        function setupScroll() {
            let lastY = 0;
            stage.addEventListener('scroll', () => {
                const curY = stage.scrollTop;
                if(state.mode === 'mode-grid' && curY > 40 && curY > lastY) header.classList.add('hide');
                else header.classList.remove('hide');
                lastY = curY;
            });
        }

        function updateSlotHTML(i, channel) {
            const el = document.getElementById('s-'+i);
            
            if(state.players[i]) {
                try { state.players[i].setMuted(true); } catch(e){}
                state.players[i] = null;
            }
            el.innerHTML = '';

            if(!channel) {
                el.innerHTML = `<div class="empty" onclick="openModal(${i})"><span>+</span></div>`;
                el.classList.remove('chat-on');
                renderSettingsPanel();
                return;
            }

            const isM = state.pos.main === i;
            const isS1 = state.pos.s1 === i;
            const isS2 = state.pos.s2 === i;

            el.innerHTML = `
                <div class="ui-bar" onclick="event.stopPropagation()">
                    <div style="display:flex; align-items:center;">
                        <span class="lbl" id="lbl-${i}"></span> 
                        <select class="pos-sel" onchange="swapPos(${i}, this.value)">
                            <option value="main" ${isM?'selected':''}>Main</option>
                            <option value="s1" ${isS1?'selected':''}>Side 1</option>
                            <option value="s2" ${isS2?'selected':''}>Side 2</option>
                            <option value="x" disabled>---</option>
                        </select>
                    </div>
                    <div class="tools">
                        <button class="btn" onclick="toggleAudio(${i}, this)">🔊</button>
                        <button class="btn" onclick="toggleChat(${i}, this)">💬</button>
                        <button class="btn" onclick="toggleFull(${i})">${state.mode==='mode-full' && state.focus===i ? '↙️' : '⛶'}</button>
                        <button class="btn" onclick="openModal(${i})">✏️</button>
                        <button class="btn del" onclick="delStream(${i})">✕</button>
                    </div>
                </div>
                <div class="content">
                    <div class="vid" id="v-${i}"></div>
                    <div class="chat-wrap" id="c-${i}"></div>
                </div>
            `;
            document.getElementById(`lbl-${i}`).innerText = channel;

            setTimeout(() => {
                try {
                    const p = new Twitch.Player('v-'+i, {
                        width: '100%', height: '100%', channel: channel, parent: PARENTS,
                        layout: 'video', autoplay: true, muted: true
                    });
                    
                    p.addEventListener(Twitch.Player.READY, () => {
                        p.setVolume(0.5);
                        applyQuality(p, state.qualities[i]);
                    });
                    state.players[i] = p;

                    const cDiv = document.getElementById('c-'+i);
                    const ifr = document.createElement('iframe');
                    
                    let parentString = `parent=${HOST}`;
                    if(HOST !== 'localhost') parentString += `&parent=localhost`;
                    if(HOST.includes('githack')) parentString += `&parent=raw.githack.com`;

                    // Zoomed Chat via transform scale im CSS ist besser als Iframe Zoom
                    ifr.src = `https://www.twitch.tv/embed/${channel}/chat?${parentString}&darkpopout`;
                    ifr.className = 'chat-frame';
                    ifr.sandbox = "allow-scripts allow-same-origin allow-popups allow-modals allow-forms"; 
                    cDiv.appendChild(ifr);
                } catch(e) {}
            }, 50);
            
            updateSlotClasses(i);
            renderSettingsPanel();
        }

        function applyQuality(player, qualityName) {
            if(!player) return;
            setTimeout(() => {
                const quals = player.getQualities();
                if(!quals || quals.length === 0) return;
                let target = null;
                if(qualityName === 'auto') target = quals.find(q => q.group === 'auto');
                else target = quals.find(q => q.name.includes(qualityName));
                if(target) player.setQuality(target.group);
            }, 2000);
        }

        function renderSettingsPanel() {
            settingsList.innerHTML = '';
            for(let i=0; i<6; i++) {
                const ch = state.slots[i] || "";
                const row = document.createElement('div');
                row.className = 'set-row';
                
                const isMain = state.pos.main === i;
                const isS1 = state.pos.s1 === i;
                const isS2 = state.pos.s2 === i;
                const isUnassigned = !isMain && !isS1 && !isS2;
                const chatActive = document.getElementById('s-'+i)?.classList.contains('chat-on');
                const currQ = state.qualities[i] || 'auto';

                row.innerHTML = `
                    <div class="set-header">
                        <span>SLOT ${i+1}</span>
                        <span>${isMain?'MAIN':isS1?'SIDE 1':isS2?'SIDE 2':''}</span>
                    </div>
                    <input class="set-input" type="text" placeholder="Leer" value="${ch}" onchange="settingsUpdateName(${i}, this.value)">
                    <select class="set-select" onchange="swapPos(${i}, this.value)">
                        <option value="main" ${isMain?'selected':''}>Pos: Main</option>
                        <option value="s1" ${isS1?'selected':''}>Pos: Side 1</option>
                        <option value="s2" ${isS2?'selected':''}>Pos: Side 2</option>
                        <option value="x" ${isUnassigned?'selected':''}>Pos: ---</option>
                    </select>
                    <select class="set-select" onchange="settingsUpdateQuality(${i}, this.value)">
                        <option value="auto" ${currQ==='auto'?'selected':''}>Qualität: Auto</option>
                        <option value="1080p" ${currQ==='1080p'?'selected':''}>Qualität: 1080p</option>
                        <option value="720p" ${currQ==='720p'?'selected':''}>Qualität: 720p</option>
                        <option value="480p" ${currQ==='480p'?'selected':''}>Qualität: 480p</option>
                        <option value="360p" ${currQ==='360p'?'selected':''}>Qualität: 360p</option>
                        <option value="160p" ${currQ==='160p'?'selected':''}>Qualität: 160p</option>
                    </select>
                    <div class="set-actions">
                        <button class="set-btn ${chatActive?'act':''}" onclick="toggleChat(${i}, null)">Chat</button>
                        <button class="set-btn danger" onclick="delStream(${i})">Leeren</button>
                    </div>
                `;
                settingsList.appendChild(row);
            }
        }

        function settingsUpdateName(i, val) {
            val = cleanUrl(val);
            if(val && val !== state.slots[i]) {
                state.slots[i] = val;
                updateSlotHTML(i, val);
                persist();
            } else if (!val) delStream(i);
        }

        function settingsUpdateQuality(i, val) {
            state.qualities[i] = val;
            if(state.players[i]) applyQuality(state.players[i], val);
            persist();
        }

        function cleanUrl(v) {
            if(!v) return "";
            v = v.trim().replace(/.*\/\//, '');
            if(v.includes('twitch.tv/')) v = v.split('twitch.tv/')[1];
            v = v.split('/')[0].split('?')[0];
            return v.replace(/[<>]/g, ""); 
        }

        function openModal(i) {
            state.editIndex = i;
            document.getElementById('modalTitle').innerText = state.slots[i] ? "Ändern" : "Hinzufügen";
            inp.value = state.slots[i] || '';
            modal.showModal();
            setTimeout(() => inp.focus(), 100);
        }

        function save() {
            let v = cleanUrl(inp.value);
            if(v) {
                state.slots[state.editIndex] = v;
                updateSlotHTML(state.editIndex, v);
                persist();
            }
            modal.close();
        }

        function delStream(i) {
            state.slots[i] = null;
            updateSlotHTML(i, null);
            persist();
        }

        function toggleAudio(idx, btn) {
            state.players.forEach((p, i) => {
                if(p) {
                    if(i === idx) {
                        const m = p.getMuted();
                        p.setMuted(!m);
                        if(btn) btn.classList.toggle('act', m);
                    } else {
                        p.setMuted(true);
                        const b = document.querySelector(`#s-${i} .btn[onclick^="toggleAudio"]`);
                        if(b) b.classList.remove('act');
                    }
                }
            });
            renderSettingsPanel();
        }

        function toggleChat(i, btn) {
            const el = document.getElementById('s-'+i);
            if(el) {
                el.classList.toggle('chat-on');
                // Sync UI Bar Button
                const uiBtn = el.querySelector(`.tools .btn:nth-child(2)`);
                if(uiBtn) uiBtn.classList.toggle('act');
                renderSettingsPanel();
            }
        }

        function toggleFull(i) {
            if(state.mode === 'mode-full' && state.focus === i) setMode('mode-grid');
            else { state.focus = i; setMode('mode-full'); }
        }

        function exitFullscreen() { setMode('mode-grid'); }

        function setMode(m) {
            state.mode = m;
            document.getElementById('stage').className = m;
            if(m === 'mode-full') document.body.classList.add('is-fullscreen');
            else document.body.classList.remove('is-fullscreen');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(m === 'mode-grid') document.querySelectorAll('.nav-item')[1].classList.add('active');
            if(m === 'mode-split') document.querySelectorAll('.nav-item')[2].classList.add('active');
            if(m === 'mode-full') document.querySelectorAll('.nav-item')[3].classList.add('active');
            
            document.getElementById('nav').classList.remove('open');
            refreshAllClasses();
            
            if(m !== 'mode-full' && state.players[state.focus]) {
                 const btn = document.querySelector(`#s-${state.focus} .btn[onclick^="toggleFull"]`);
                 if(btn) btn.innerText = '⛶';
            }
        }

        function swapPos(idx, role) {
            const oldOwner = state.pos[role];
            let currentRole = null;
            if(state.pos.main == idx) currentRole = 'main';
            if(state.pos.s1 == idx) currentRole = 's1';
            if(state.pos.s2 == idx) currentRole = 's2';
            state.pos[role] = idx;
            if(currentRole) state.pos[currentRole] = oldOwner;
            refreshAllClasses();
            renderSettingsPanel();
        }

        function updateSlotClasses(i) {
            const el = document.getElementById('s-'+i);
            el.classList.remove('p-main', 'p-side1', 'p-side2', 'is-focus');
            if(state.mode === 'mode-split') {
                if(state.pos.main == i) el.classList.add('p-main');
                if(state.pos.s1 == i) el.classList.add('p-side1');
                if(state.pos.s2 == i) el.classList.add('p-side2');
            }
            if(state.mode === 'mode-full' && state.focus == i) {
                el.classList.add('is-focus');
            }
        }

        function refreshAllClasses() { for(let i=0; i<6; i++) updateSlotClasses(i); }
        function toggleNav() { document.getElementById('nav').classList.toggle('open'); }
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.menu-content').forEach(c => c.classList.remove('active'));
            if(tabName === 'view') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-view').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-settings').classList.add('active');
                renderSettingsPanel();
            }
        }

        function persist() { 
            const data = { slots: state.slots, qualities: state.qualities, longChat: state.longChat };
            localStorage.setItem('sc-v28', JSON.stringify(data)); 
        }
        function loadStorage() {
            let d = localStorage.getItem('sc-v28');
            if(!d) d = localStorage.getItem('sc-v27');
            if(!d) d = localStorage.getItem('sc-v26');
            if(!d) d = localStorage.getItem('sc-v25');

            if(d) {
                try {
                    const parsed = JSON.parse(d);
                    if(Array.isArray(parsed)) { state.slots = parsed; } 
                    else { 
                        state.slots = parsed.slots || Array(6).fill(null); 
                        state.qualities = parsed.qualities || Array(6).fill('auto'); 
                        state.longChat = parsed.longChat || false;
                    }
                    state.slots.forEach((n, i) => { if(n) { updateSlotHTML(i, n); } });
                } catch(e) {}
            }
        }

        init();
    </script>
</body>
</html>
